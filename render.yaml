services:
  - type: web
    name: shesafe
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir SheSafe SheSafe.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
